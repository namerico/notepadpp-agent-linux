<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad++ Agent Linux - Antigravity Modern Card</title>
  <style>
    :root {
      --primary: #4361ee;
      --accent: #4cc9f0;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #1e1b4b, var(--bg-dark));
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 60px -10px rgba(67, 97, 238, 0.3);
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      margin-bottom: 1.25rem;
    }

    h2 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Antigravity AI & Notepad++</span>
    <h2>Glassmorphism Card</h2>
    <p>Este exemplo foi escrito diretamente na sua tela em tempo real via Agent Bridge IPC pelo Google Antigravity.</p>
    <a href="#" class="btn">Explorar Componente</a>
  </div>
</body>
</html>
